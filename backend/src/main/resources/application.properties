spring.application.name=futrack-api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/futrack}
spring.datasource.username=${DB_USERNAME:futrack}
spring.datasource.password=${DB_PASSWORD:futrack}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
